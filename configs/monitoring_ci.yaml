monitoring:
  random_seed: 42
  reference_path: data/processed/synthetic_fleet.parquet
  output_dir: reports/generated/monitoring/ci
  window_count: 2
  reference_rows: 256
  rows_per_window: 128
  bootstrap_resamples: 100
  drift:
    columns:
      - sensor_1
      - operating_condition
    psi_threshold: 0.1
    missingness_threshold: 0.05
  data_quality:
    max_missing_fraction: 0.10
    stuck_value_fraction: 0.95
    minimum_stuck_observations: 5
