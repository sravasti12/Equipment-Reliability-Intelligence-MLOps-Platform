services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: file:/app/mlruns
      SERVING_MANIFEST_PATH: /app/serving_model.json
      CREW_CAPACITY_PER_SHIFT: "5"
      RISK_THRESHOLD: "0.5"
      URGENCY_HORIZON_CYCLES: "30"
    volumes:
      - ./mlruns:/app/mlruns:ro
      - ./reports/generated/serving_model.json:/app/serving_model.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; response=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); raise SystemExit(0 if response['model_available'] else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - src/reliability_platform/dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      RELIABILITY_PLATFORM_ROOT: /app
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./reports/generated:/app/reports/generated:ro
    depends_on:
      api:
        condition: service_healthy
