repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: python -m ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: Ruff format check
        entry: python -m ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy
        name: Mypy
        entry: python -m mypy src
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        always_run: true
