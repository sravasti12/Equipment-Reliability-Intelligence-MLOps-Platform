[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "reliability-platform"
version = "0.1.0"
description = "Industrial equipment reliability intelligence and MLOps platform"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "mlflow==2.22.0",
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pydantic==2.11.7",
    "pyarrow==19.0.1",
    "PyYAML==6.0.2",
    "scikit-learn==1.6.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel==6.29.5",
    "matplotlib==3.10.3",
    "mypy==1.15.0",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "pandas-stubs==2.2.3.250308",
    "pre-commit==4.2.0",
    "pytest==8.3.5",
    "ruff==0.11.13",
    "types-PyYAML==6.0.12.20250516",
]

[project.scripts]
reliability-platform = "reliability_platform.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_tmp"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
